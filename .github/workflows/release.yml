name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run release checks
        run: cargo xtask release-check
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            executable: rubase
          - name: macos-arm64
            os: macos-14
            executable: rubase
          - name: windows-x86_64
            os: windows-latest
            executable: rubase.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build CLI
        run: cargo build --profile dist --package rubase-cli

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/dist/${{ matrix.executable }}" "dist/rubase-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubase-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --generate-notes --verify-tag
