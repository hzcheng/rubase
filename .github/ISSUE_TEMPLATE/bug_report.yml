name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RuBase version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and Rust version.
    validations:
      required: true
